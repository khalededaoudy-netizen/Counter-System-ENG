<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>University Queue — Public Display</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="display-body">
  <header class="display-header">
    <h1>UNIVERSITY QUEUE</h1>
    <div id="business-date" class="business-date"></div>
  </header>

  <main class="display-main">
    <section class="now-serving">
      <div class="label">NOW SERVING</div>
      <div id="current-number" class="current-number">—</div>
      <div id="current-counter" class="current-counter"></div>
    </section>

    <section class="next-numbers">
      <div class="label">NEXT NUMBERS</div>
      <div id="next-list" class="next-list"></div>
    </section>

    <section class="stats-row">
      <div class="stat">
        <div class="stat-label">TOTAL TODAY</div>
        <div id="stat-total" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">WAITING</div>
        <div id="stat-waiting" class="stat-value">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">CALLED</div>
        <div id="stat-called" class="stat-value">0</div>
      </div>
    </section>
  </main>

  <div id="offline-banner" class="offline-banner" hidden>
    Connection lost — retrying…
  </div>

  <script src="/static/display.js"></script>
</body>
</html>
