<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Call Next — University Queue</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="call-body">
  <div class="call-card">
    <h1>Call Next Ticket</h1>
    <p class="call-note">
      Minimal stand-in for now — a full per-counter dashboard is planned for Phase 4.
      Enter your counter number and press Call.
    </p>

    <label for="counter-input">Counter number</label>
    <input id="counter-input" type="number" min="1" inputmode="numeric" value="1">

    <button id="call-btn">CALL NEXT</button>

    <div id="result" class="call-result"></div>
  </div>

  <script src="/static/call.js"></script>
</body>
</html>
